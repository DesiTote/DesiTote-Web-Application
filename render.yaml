# Render blueprint for the API. In Render: New > Blueprint, point it at this
# repo, then fill in the secret values (marked sync: false) in the dashboard.
#
# Render runs a normal always-on Node process, so no serverless adapter is
# needed - `npm run build` && `npm start` works as-is.

services:
  - type: web
    name: desitotes-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      # Comma-separated list of allowed frontend origins. Must include the
      # exact Vercel URL, or the browser blocks every API call.
      - key: CLIENT_ORIGIN
        sync: false

      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_PINCODE
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      - key: SHIPROCKET_WEBHOOK_TOKEN
        sync: false

      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
