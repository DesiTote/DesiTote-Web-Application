# Render blueprint for the API. In Render: New > Blueprint, point it at this
# repo, then fill in the secret values (marked sync: false) in the dashboard.
#
# Render runs a normal always-on Node process, so no serverless adapter is
# needed - `npm run build` && `npm start` works as-is.

services:
  - type: web
    name: desitotes-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is required: NODE_ENV=production (needed at runtime for
    # Secure cookies) makes npm skip devDependencies, but typescript and
    # @types/node live there and the build is `tsc`.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      # Comma-separated list of allowed frontend origins. Must include the
      # exact Vercel URL, or the browser blocks every API call.
      - key: CLIENT_ORIGIN
        sync: false

      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_PICKUP_PINCODE
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        sync: false
      - key: SHIPROCKET_WEBHOOK_TOKEN
        sync: false

      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # The shop's own mailbox. Customer replies and complaints go here;
      # EMAIL_FROM has to be on a domain verified in Resend, which a Gmail
      # address can never be.
      - key: EMAIL_REPLY_TO
        sync: false
      # "resend" or "gmail" — see backend/.env.example.
      - key: EMAIL_TRANSPORT
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

  # Same API in Singapore, next to the Mumbai database. Every value is copied
  # from desitotes-api on Render's side, so no secret is re-typed. Once the site
  # is switched over and Oregon is removed, these become `sync: false`.
  - type: web
    name: desitotes-api-sg
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        fromService:
          name: desitotes-api
          type: web
          envVarKey: CLIENT_ORIGIN
      - key: MONGO_URI
        fromService:
          name: desitotes-api
          type: web
          envVarKey: MONGO_URI
      - key: JWT_SECRET
        fromService:
          name: desitotes-api
          type: web
          envVarKey: JWT_SECRET
      - key: UPSTASH_REDIS_REST_URL
        fromService:
          name: desitotes-api
          type: web
          envVarKey: UPSTASH_REDIS_REST_URL
      - key: UPSTASH_REDIS_REST_TOKEN
        fromService:
          name: desitotes-api
          type: web
          envVarKey: UPSTASH_REDIS_REST_TOKEN
      - key: RAZORPAY_KEY_ID
        fromService:
          name: desitotes-api
          type: web
          envVarKey: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
        fromService:
          name: desitotes-api
          type: web
          envVarKey: RAZORPAY_KEY_SECRET
      - key: RAZORPAY_WEBHOOK_SECRET
        fromService:
          name: desitotes-api
          type: web
          envVarKey: RAZORPAY_WEBHOOK_SECRET
      - key: SHIPROCKET_EMAIL
        fromService:
          name: desitotes-api
          type: web
          envVarKey: SHIPROCKET_EMAIL
      - key: SHIPROCKET_PASSWORD
        fromService:
          name: desitotes-api
          type: web
          envVarKey: SHIPROCKET_PASSWORD
      - key: SHIPROCKET_PICKUP_PINCODE
        fromService:
          name: desitotes-api
          type: web
          envVarKey: SHIPROCKET_PICKUP_PINCODE
      - key: SHIPROCKET_PICKUP_LOCATION
        fromService:
          name: desitotes-api
          type: web
          envVarKey: SHIPROCKET_PICKUP_LOCATION
      - key: SHIPROCKET_WEBHOOK_TOKEN
        fromService:
          name: desitotes-api
          type: web
          envVarKey: SHIPROCKET_WEBHOOK_TOKEN
      - key: AWS_REGION
        fromService:
          name: desitotes-api
          type: web
          envVarKey: AWS_REGION
      - key: AWS_ACCESS_KEY_ID
        fromService:
          name: desitotes-api
          type: web
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          name: desitotes-api
