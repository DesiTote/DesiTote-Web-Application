# Render's free plan suspends a service after ~15 minutes without a request,
# and waking it takes about 20 seconds. Measured on the live site: a cold
# catalogue call took 20.9s, during which the homepage shows nothing at all.
# A request every 10 minutes keeps it from ever going to sleep.
#
# One always-on free service costs about 730 of the 750 free instance-hours a
# month, so this fits — but only for a single service. This is a workaround,
# not a substitute for a paid instance on a shop that takes money.

name: Keep API warm

on:
  schedule:
    # Every 10 minutes. GitHub queues scheduled runs and can be a few minutes
    # late under load, hence 10 rather than 14.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API
        run: |
          # A sleeping instance can take ~30s to answer, so allow for it.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
            https://desitotes-api.onrender.com/ || echo "000")
          echo "API responded: $code"
          # Never fail the workflow: a red cron on the repo every 10 minutes is
          # noise, and a single missed ping is harmless.
          exit 0
