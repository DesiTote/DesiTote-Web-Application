# Static frontend. Place at /etc/nginx/sites-available/yourdomain.com and
# symlink into sites-enabled, then run `certbot --nginx -d yourdomain.com -d www.yourdomain.com`.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/desitotes-frontend/dist;
    index index.html;

    # Single-page app — let React Router handle unknown paths.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
