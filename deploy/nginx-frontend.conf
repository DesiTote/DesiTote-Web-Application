# Static frontend. Place at /etc/nginx/sites-available/desitotes.com and
# symlink into sites-enabled, then run `certbot --nginx -d desitotes.com -d www.desitotes.com`.

server {
    listen 80;
    server_name desitotes.com www.desitotes.com;

    root /var/www/desitotes-frontend/dist;
    index index.html;

    # The API is served from this same origin, on purpose. When the browser
    # talked to the API on its own domain, the auth cookie became a third-party
    # cookie and iOS Safari dropped it by default: login appeared to succeed and
    # then every request arrived signed out. Same origin also means no CORS and
    # no reliance on SameSite=None.
    #
    # Must come before `location /` so it wins for API paths.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Razorpay's webhook signature is computed over the raw body, so it must
        # be forwarded untouched and unbuffered.
        proxy_request_buffering off;
    }

    # Single-page app — let React Router handle unknown paths.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
