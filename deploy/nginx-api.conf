# Reverse proxy for the backend API. Place at
# /etc/nginx/sites-available/api.yourdomain.com and symlink into sites-enabled,
# then run `certbot --nginx -d api.yourdomain.com` to add HTTPS.

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Razorpay webhook needs the raw request body — same proxy_pass above already
    # forwards it untouched, so no special handling is required here.
}
